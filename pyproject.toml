[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pullwise"
version = "0.4.0"
description = "AI-powered PR descriptions, labels, and code review using OpenAI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["github", "pull-request", "openai", "ai", "automation", "devtools", "cli", "github-actions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pr-pilot = "pr_pilot.cli:main"
pullwise = "pr_pilot.cli:main"

[project.urls]
Homepage = "https://github.com/albertusreza/pr-pilot"
Issues   = "https://github.com/albertusreza/pr-pilot/issues"
"GitHub Action" = "https://github.com/marketplace/actions/pr-pilot"

[tool.setuptools.packages.find]
where   = ["."]
include = ["pr_pilot*"]

[tool.setuptools]
license-files = []
